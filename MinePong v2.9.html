            classic:   { look: "flat",   p1: "#ffffff", p2: "#ffffff", ball: "#ffffff", bg: "#000000" },
            cyber:     { look: "neon",   p1: "#00e5ff", p2: "#ff2bd6", ball: "#eaffff", bg: "#07001d",
                         grid: "rgba(0,229,255,0.09)", mid: "rgba(255,43,214,0.4)" },
            nether:    { look: "lava",   p1: "#ff7a1a", p2: "#c92a12", ball: "#ffd27a", bg: "#2a0b06" },
            space:     { look: "space",  p1: "#9fd8ff", p2: "#c39cff", ball: "#ffffff", bg: "#05041a" },
            ocean:     { look: "water",  p1: "#3fe0d0", p2: "#1d7fd6", ball: "#e6ffff", bg: "#02243a" },
            candy:     { look: "candy",  p1: "#ff5fa2", p2: "#7ed6ff", ball: "#ff2d7a", bg: "#ffe6f2" },
            matrix:    { look: "code",   p1: "#39ff14", p2: "#0aa30a", ball: "#aaffaa", bg: "#000900" }
        };
        const THEME_ORDER = ["minecraft", "classic", "cyber", "nether", "space", "ocean", "candy", "matrix"];
        function themeStyle() { return THEMES[settings.theme] || THEMES.minecraft; }
        let frame = 0;   // ticks every drawn frame, drives the animated themes

        function roundRectPath(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
        function drawDashedMid(color, width, dash) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash(dash || [14, 14]);
            ctx.beginPath();
            ctx.moveTo(0, FIELD_H / 2);
            ctx.lineTo(FIELD_W, FIELD_H / 2);
            ctx.stroke();
            ctx.restore();
        }

        // --- generated tiles for the non-Minecraft textured themes ---
        const netherTile = (function () {
            const c = makeTile(16), g = c.getContext("2d"), r = rng(9);
            for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
                const v = r();
                let col = v < 0.2 ? "#5c1a10" : v < 0.45 ? "#4a1109" : v < 0.72 ? "#3a0d07" : "#642016";
                if (v > 0.965) col = "#8c2a12";        // brighter grains
                g.fillStyle = col; g.fillRect(x, y, 1, 1);
            }
            return c;
        })();
        const candyTile = (function () {
            const c = makeTile(32), g = c.getContext("2d");
            g.fillStyle = "#ffe6f2"; g.fillRect(0, 0, 32, 32);
            g.fillStyle = "#ffd0e6";
            [[8, 8], [24, 24]].forEach(([x, y]) => {
                g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill();
            });
            g.fillStyle = "#fff2f8";
            [[24, 8], [8, 24]].forEach(([x, y]) => {
                g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2); g.fill();
            });
            return c;
        })();
        let netherPattern = null, candyPattern = null;
        function patternOf(tile, size, cache) {
            const big = document.createElement("canvas");
            big.width = big.height = size;
            const g = big.getContext("2d");
            g.imageSmoothingEnabled = false;
            g.drawImage(tile, 0, 0, size, size);
            return ctx.createPattern(big, "repeat");
        }

        // starfield (space) and rain columns (matrix), rebuilt on resize
        let starField = null, rainCols = null;
        function getStars() {
            if (!starField) {
                const r = rng(1234);
                starField = [];
                const count = Math.round((FIELD_W * FIELD_H) / 5200);
                for (let i = 0; i < count; i++) {
                    starField.push({ x: r() * FIELD_W, y: r() * FIELD_H,
                                     s: 1 + Math.round(r() * 2), a: 0.25 + r() * 0.6 });
                }
            }
            return starField;
        }
        function getRain() {
            if (!rainCols) {
                const r = rng(77);
                rainCols = [];
                for (let x = 6; x < FIELD_W; x += 18) {
                    rainCols.push({ x: x, y: r() * FIELD_H, speed: 1.2 + r() * 2.6, len: 5 + Math.floor(r() * 7) });
                }
            }
            return rainCols;
        }

        // ---------------- backgrounds ----------------
        function drawFieldDecor() {
            const st = themeStyle();
            switch (st.look) {
                case "pixel": {
                    ctx.fillStyle = getMossyPattern();
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    return;
                }
                case "flat": {
                    ctx.fillStyle = settings.classic.bg;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    ctx.save();
                    ctx.globalAlpha = 0.7;
                    drawDashedMid(settings.classic.ball, 4);
                    ctx.restore();
                    return;
                }
                case "neon": {
                    ctx.fillStyle = st.bg;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    ctx.strokeStyle = st.grid;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = 32; x < FIELD_W; x += 32) { ctx.moveTo(x, 0); ctx.lineTo(x, FIELD_H); }
                    for (let y = 32; y < FIELD_H; y += 32) { ctx.moveTo(0, y); ctx.lineTo(FIELD_W, y); }
                    ctx.stroke();
                    drawDashedMid(st.mid, 3, [10, 12]);
                    return;
                }
                case "lava": {   // netherrack with glowing cracks
                    if (!netherPattern) netherPattern = patternOf(netherTile, 64, "nether");
                    ctx.fillStyle = netherPattern;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    const pulse = 0.35 + 0.15 * Math.sin(frame / 22);
                    ctx.save();
                    ctx.globalAlpha = pulse;
                    ctx.strokeStyle = "#ff5a14";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        const y = FIELD_H * (0.18 + i * 0.22);
                        ctx.moveTo(0, y);
                        for (let x = 0; x <= FIELD_W; x += 64) {
                            ctx.lineTo(x, y + ((i + x) % 3 - 1) * 12);
                        }
                    }
                    ctx.stroke();
                    ctx.restore();
                    drawDashedMid("rgba(255,120,26,0.5)", 4, [22, 16]);
                    return;
                }
                case "space": {
                    ctx.fillStyle = st.bg;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    const neb = ctx.createRadialGradient(FIELD_W * 0.7, FIELD_H * 0.3, 10,
                                                         FIELD_W * 0.7, FIELD_H * 0.3, FIELD_W * 0.8);
                    neb.addColorStop(0, "rgba(120,80,220,0.28)");
                    neb.addColorStop(1, "rgba(120,80,220,0)");
                    ctx.fillStyle = neb;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    for (const s of getStars()) {
                        ctx.globalAlpha = s.a * (0.7 + 0.3 * Math.sin((frame + s.x) / 18));
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(s.x, s.y, s.s, s.s);
                    }
                    ctx.globalAlpha = 1;
                    drawDashedMid("rgba(159,216,255,0.3)", 2, [6, 18]);
                    return;
                }
                case "water": {   // depth gradient with slow waves and bubbles
                    const grad = ctx.createLinearGradient(0, 0, 0, FIELD_H);
                    grad.addColorStop(0, "#0b3f5e");
                    grad.addColorStop(0.5, "#02243a");
                    grad.addColorStop(1, "#011726");
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    ctx.save();
                    ctx.strokeStyle = "rgba(120,220,235,0.16)";
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 5; i++) {
                        const baseY = FIELD_H * (0.12 + i * 0.19);
                        ctx.beginPath();
                        for (let x = 0; x <= FIELD_W; x += 8) {
                            const y = baseY + Math.sin((x / 46) + (frame / 30) + i) * 7;
                            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }
                    ctx.fillStyle = "rgba(180,240,255,0.18)";
                    for (let i = 0; i < 14; i++) {
                        const bx = ((i * 137) % FIELD_W);
                        const by = FIELD_H - ((frame * (0.6 + (i % 4) * 0.25) + i * 90) % (FIELD_H + 40));
                        ctx.beginPath();
                        ctx.arc(bx, by, 3 + (i % 3), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    drawDashedMid("rgba(63,224,208,0.3)", 3, [16, 14]);
                    return;
                }
                case "candy": {
                    if (!candyPattern) candyPattern = patternOf(candyTile, 64, "candy");
                    ctx.fillStyle = candyPattern;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    ctx.save();   // sugar stripe across the middle
                    ctx.globalAlpha = 0.55;
                    ctx.lineWidth = 10;
                    ctx.strokeStyle = "#ff9ec4";
                    ctx.setLineDash([18, 14]);
                    ctx.beginPath();
                    ctx.moveTo(0, FIELD_H / 2);
                    ctx.lineTo(FIELD_W, FIELD_H / 2);
                    ctx.stroke();
                    ctx.restore();
                    return;
                }
                case "code": {   // falling glyph columns
                    ctx.fillStyle = st.bg;
                    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
                    ctx.save();
                    ctx.font = "14px Courier New";
                    ctx.textAlign = "center";
                    for (const col of getRain()) {
                        for (let i = 0; i < col.len; i++) {
                            const y = col.y - i * 16;
                            if (y < -16 || y > FIELD_H + 16) continue;
                            ctx.globalAlpha = i === 0 ? 0.85 : Math.max(0, 0.4 - i * 0.05);
                            ctx.fillStyle = i === 0 ? "#c9ffb8" : "#39ff14";
                            const ch = String.fromCharCode(0x30A0 + ((col.x + i * 7 + (frame >> 3)) % 90));
                            ctx.fillText(ch, col.x, y);
                        }
                    }
                    ctx.restore();
                    ctx.globalAlpha = 1;
                    drawDashedMid("rgba(57,255,20,0.28)", 2, [8, 10]);
                    return;
                }
            }
        }

        function setDropShadow() {
            ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
            ctx.shadowBlur = 7;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 6;
        }

        // ---------------- paddles ----------------
        function drawPaddle(p, isPlayer) {
            const st = themeStyle();
            const col = isPlayer ? st.p1 : st.p2;
            ctx.save();
            switch (st.look) {
                case "pixel": {
                    const img = (ironImg.complete && ironImg.naturalWidth > 0) ? ironImg : ironTile;
                    setDropShadow();
                    for (let i = 0; i < 4; i++) ctx.drawImage(img, p.x + (i * 32), p.y, 32, 32);
                    break;
                }
                case "flat": {
                    setDropShadow();
                    ctx.fillStyle = isPlayer ? settings.classic.player : settings.classic.ai;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    break;
                }
                case "neon": {
                    ctx.shadowBlur = 16;
                    ctx.shadowColor = col;
                    ctx.fillStyle = col;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(255,255,255,0.85)";
                    ctx.fillRect(p.x, p.y + (isPlayer ? 0 : p.h - 6), p.w, 6);
                    break;
                }
                case "lava": {   // obsidian slab with molten cracks
                    setDropShadow();
                    ctx.fillStyle = "#241016";
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = col;
                    for (let i = 0; i < 4; i++) {
                        const cx = p.x + 8 + i * 32;
                        ctx.fillRect(cx, p.y + 6, 16, 4);
                        ctx.fillRect(cx + 4, p.y + 18, 8, 4);
                    }
                    ctx.fillStyle = "rgba(255,220,120," + (0.5 + 0.3 * Math.sin(frame / 12)) + ")";
                    ctx.fillRect(p.x, isPlayer ? p.y : p.y + p.h - 3, p.w, 3);
                    break;
                }
                case "space": {  // brushed metal hull
                    setDropShadow();
                    const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
                    g.addColorStop(0, "#f2f6ff");
                    g.addColorStop(0.5, col);
                    g.addColorStop(1, "#2b3352");
                    ctx.fillStyle = g;
                    roundRectPath(p.x, p.y, p.w, p.h, 8);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(255,255,255,0.55)";
                    ctx.fillRect(p.x + 10, p.y + p.h / 2 - 1, p.w - 20, 2);
                    break;
                }
                case "water": {  // smooth capsule with a wet highlight
                    setDropShadow();
                    ctx.fillStyle = col;
                    roundRectPath(p.x, p.y, p.w, p.h, p.h / 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(255,255,255,0.4)";
                    roundRectPath(p.x + 8, p.y + 5, p.w - 16, 6, 3);
                    ctx.fill();
                    break;
                }
                case "candy": {  // striped candy bar
                    setDropShadow();
                    ctx.fillStyle = col;
                    roundRectPath(p.x, p.y, p.w, p.h, 12);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.save();
                    roundRectPath(p.x, p.y, p.w, p.h, 12);
                    ctx.clip();
                    ctx.fillStyle = "rgba(255,255,255,0.55)";
                    for (let x = -p.h; x < p.w; x += 22) {
                        ctx.beginPath();
                        ctx.moveTo(p.x + x, p.y + p.h);
                        ctx.lineTo(p.x + x + 10, p.y + p.h);
                        ctx.lineTo(p.x + x + 10 + p.h, p.y);
                        ctx.lineTo(p.x + x + p.h, p.y);
                        ctx.closePath();
                        ctx.fill();
                    }
                    ctx.restore();
                    break;
                }
                case "code": {   // terminal block with scanlines
                    ctx.fillStyle = "#04210a";
                    ctx.fillRect(p.x - 2, p.y - 2, p.w + 4, p.h + 4);
                    ctx.fillStyle = col;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = "rgba(0,0,0,0.35)";
                    for (let y = p.y + 2; y < p.y + p.h; y += 4) ctx.fillRect(p.x, y, p.w, 2);
                    ctx.fillStyle = "rgba(200,255,190,0.9)";
                    ctx.fillRect(p.x, isPlayer ? p.y : p.y + p.h - 2, p.w, 2);
                    break;
                }
            }
            ctx.restore();
        }

        // ---------------- ball ----------------
        function drawBall() {
            const st = themeStyle();
            const cx = ball.x + ball.size / 2;
            const cy = ball.y + ball.size / 2;
            const r = ball.size / 2;
            ctx.save();
            switch (st.look) {
                case "pixel": {
                    const img = (snowballImg.complete && snowballImg.naturalWidth > 0) ? snowballImg : snowballTile;
                    setDropShadow();
                    ctx.drawImage(img, ball.x, ball.y, ball.size, ball.size);
                    break;
                }
                case "flat": {
                    setDropShadow();
                    ctx.fillStyle = settings.classic.ball;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case "neon": {
                    ctx.shadowBlur = 22;
                    ctx.shadowColor = "#a4f6ff";
                    ctx.fillStyle = st.ball;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case "lava": {   // molten blob with a hot core
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "#ff6a10";
                    const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, r);
                    g.addColorStop(0, "#fff3c4");
                    g.addColorStop(0.5, "#ffb02e");
                    g.addColorStop(1, "#e0400c");
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case "space": { // little moon with a soft halo
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = "#cfe6ff";
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(150,170,220,0.55)";
                    ctx.beginPath(); ctx.arc(cx + r * 0.3, cy + r * 0.25, r * 0.55, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case "water": { // air bubble: ring plus a shine
                    ctx.fillStyle = "rgba(200,255,255,0.45)";
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = "#eaffff";
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(cx, cy, r - 1.5, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = "rgba(255,255,255,0.9)";
                    ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.22, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case "candy": { // gumball with a glossy dot
                    setDropShadow();
                    ctx.fillStyle = st.ball;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(255,255,255,0.85)";
                    ctx.beginPath(); ctx.arc(cx - r * 0.32, cy - r * 0.32, r * 0.28, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case "code": {  // glowing glyph with a fading trail
                    ctx.fillStyle = "rgba(57,255,20,0.18)";
                    ctx.fillRect(cx - r, cy - r * 2.2, ball.size, ball.size * 2);
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = "#39ff14";
                    ctx.fillStyle = st.ball;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                    break;
                }
            }
            ctx.restore();
        }

        var vignette = null;
        function getVignette() {
            if (!vignette) {
                vignette = ctx.createRadialGradient(
                    FIELD_W / 2, FIELD_H / 2, Math.min(FIELD_W, FIELD_H) * 0.45,
                    FIELD_W / 2, FIELD_H / 2, Math.max(FIELD_W, FIELD_H) * 0.72);
                vignette.addColorStop(0, "rgba(0,0,0,0)");
                vignette.addColorStop(1, "rgba(0,0,0,0.26)");
            }
            return vignette;
        }
        function drawVignette() {
            ctx.fillStyle = getVignette();
            ctx.fillRect(0, 0, FIELD_W, FIELD_H);
        }
        function drawPauseOverlay() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#ffff55";
            ctx.font = "bold 42px Courier New";
            ctx.textAlign = "center";
            ctx.fillText(t("paused"), canvas.width / 2, canvas.height / 2);
        }

        // ------- Input: pointer drag (mapped through orientation) -------
        function pointerToField(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
            // landscape draws the field rotated 90° clockwise, so undo that here
            return ORIENT === "landscape"
                ? { x: sy, y: FIELD_H - sx }
                : { x: sx, y: sy };
        }
        function movePaddleTo(paddle, fieldX) {
            paddle.x = Math.max(0, Math.min(FIELD_W - paddle.w, fieldX - paddle.w / 2));
        }
        // several fingers at once: each pointer remembers which paddle it drives
        const activePointers = new Map();
        function paddleForTouch(pos) {
            if (isOnline()) return net.role === "guest" ? ai : player; // your own paddle
            if (!isDuo()) return player;              // single player always drives the bottom
            return pos.y > FIELD_H / 2 ? player : ai; // duo: your own half of the field
        }
        canvas.addEventListener("pointerdown", (e) => {
            if (gameState !== "PLAYING") return;
            const pos = pointerToField(e);
            const paddle = paddleForTouch(pos);
            activePointers.set(e.pointerId, paddle);
            canvas.setPointerCapture(e.pointerId);
            movePaddleTo(paddle, pos.x);
            e.preventDefault();
        });
        canvas.addEventListener("pointermove", (e) => {
            if (gameState !== "PLAYING") return;
            const pos = pointerToField(e);
            const paddle = activePointers.get(e.pointerId)
                || (e.pointerType === "mouse" ? paddleForTouch(pos) : null);
            if (paddle) movePaddleTo(paddle, pos.x);
            e.preventDefault();
        });
        ["pointerup", "pointercancel"].forEach((n) =>
            canvas.addEventListener(n, (e) => { activePointers.delete(e.pointerId); }));

        // ------- Keyboard -------
        document.addEventListener("keydown", (e) => {
            const tag = e.target.tagName;
            if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || tag === "BUTTON") return;
            const landscape = ORIENT === "landscape";
            const k = e.key.toLowerCase();
            // in two-player mode A/D belong to player 2, arrows stay with player 1
            if (isDuo() && (k === "a" || k === "w")) { controls.rivalLeft = true; e.preventDefault(); }
            if (isDuo() && (k === "d" || k === "s")) { controls.rivalRight = true; e.preventDefault(); }
            const p1Left = e.key === "ArrowLeft" || (!isDuo() && k === "a") ||
                (landscape && (e.key === "ArrowUp" || (!isDuo() && k === "w")));
            const p1Right = e.key === "ArrowRight" || (!isDuo() && k === "d") ||
                (landscape && (e.key === "ArrowDown" || (!isDuo() && k === "s")));
            if (p1Left) { controls.left = true; e.preventDefault(); }
            if (p1Right) { controls.right = true; e.preventDefault(); }
            if (e.key === " ") { togglePause(); e.preventDefault(); }
        });
        document.addEventListener("keyup", (e) => {
            const k = e.key.toLowerCase();
            if (isDuo() && (k === "a" || k === "w")) controls.rivalLeft = false;
            if (isDuo() && (k === "d" || k === "s")) controls.rivalRight = false;
            if (["arrowleft", "a", "arrowup", "w"].includes(k)) controls.left = false;
            if (["arrowright", "d", "arrowdown", "s"].includes(k)) controls.right = false;
        });

        // Auto-pause in background
        function pauseIfPlaying() {
            controls.left = controls.right = false;
            controls.rivalLeft = controls.rivalRight = false;
            activePointers.clear();
            if (isOnline() && net.role === "guest") return; // the host controls the match
            if (gameState === "PLAYING") {
                gameState = "PAUSED";
                pauseBtn.innerText = t("resume");
            }
        }
        window.addEventListener("blur", pauseIfPlaying);
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                pauseIfPlaying();
                if (audioCtx && audioCtx.state === "running") audioCtx.suspend();
            } else if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        });

        // ------- Settings UI -------
        function applyLanguage() {
            document.querySelectorAll("[data-i18n]").forEach((el) => {
                el.innerText = t(el.getAttribute("data-i18n"));
            });
            const opts = difficultySelect.options;
            opts[0].text = t("diffEasy");
            opts[1].text = t("diffNormal");
            opts[2].text = t("diffHard");
            pauseBtn.innerText = gameState === "PAUSED" ? t("resume") : t("pause");
            statusText.innerText = t(lastStatusKey);
            hintEl.innerText = currentHint();
            updateScoreLabels();
            updateRoomButtons();
            rotationToggle.innerText = settings.rotation ? t("on") : t("off");
            versionLine.innerText = "v" + GAME_VERSION;
            nickInput.value = settings.nick;
            refreshOrderUI();
            setRandomSplash();
            document.documentElement.lang = settings.lang;
        }
        function currentHint() {
            if (isOnline()) return t("hintOnline");
            return isDuo() ? t("hintDuo") : t("hint");
        }
        function applyMode() {
            duoOverlay.hidden = !isTwoPlayer();
            uiOverlay.hidden = isTwoPlayer();
            hintEl.innerText = currentHint();
            // in two-player modes the top paddle belongs to a human
            resetPaddles();
            updateScoreLabels();
            updateRoomButtons();
            renderStats();
        }
        function applyTheme() {
            document.body.dataset.theme = settings.theme;
            refreshThemePicker();
            classicColorsRow.hidden = settings.theme !== "classic";
            syncColorInputs();
        }
        // small live preview: field colour, both paddles and the ball
        function drawThemePreview() {
            const g = themePrevCtx;
            const st = THEMES[settings.theme] || THEMES.minecraft;
            const W = themePreview.width, H = themePreview.height;
            const isClassic = st.look === "flat";
            g.clearRect(0, 0, W, H);
            g.fillStyle = isClassic ? settings.classic.bg : st.bg;
            g.fillRect(0, 0, W, H);
            if (st.look === "space") {
                g.fillStyle = "#ffffff";
                for (let i = 0; i < 18; i++) g.fillRect((i * 53) % W, (i * 31) % H, 2, 2);
            } else if (st.look === "code") {
                g.fillStyle = "rgba(57,255,20,0.35)";
                for (let x = 6; x < W; x += 16) g.fillRect(x, (x * 7) % H, 2, 12);
            } else if (st.look === "candy") {
                g.fillStyle = "#ffd0e6";
                for (let i = 0; i < 10; i++) {
                    g.beginPath(); g.arc((i * 47) % W, (i * 23) % H, 5, 0, Math.PI * 2); g.fill();
                }
            } else if (st.look === "lava") {
                g.fillStyle = "rgba(255,90,20,0.45)";
                g.fillRect(0, H * 0.35, W, 3);
                g.fillRect(0, H * 0.7, W, 3);
            }
            g.fillStyle = isClassic ? settings.classic.ai : st.p2;
            g.fillRect(W / 2 - 46, 8, 92, 8);
            g.fillStyle = isClassic ? settings.classic.player : st.p1;
            g.fillRect(W / 2 - 46, H - 16, 92, 8);
            g.fillStyle = isClassic ? settings.classic.ball : st.ball;
            g.beginPath();
            g.arc(W / 2, H / 2, 8, 0, Math.PI * 2);
            g.fill();
        }
        function refreshThemePicker() {
            const i = THEME_ORDER.indexOf(settings.theme);
            const names = { minecraft: "themeMinecraft", classic: "themeClassic", cyber: "themeCyber",
                            nether: "themeNether", space: "themeSpace", ocean: "themeOcean",
                            candy: "themeCandy", matrix: "themeMatrix" };
            themeNameEl.innerText = t(names[settings.theme] || "themeMinecraft");
            themePosEl.innerText = (i + 1) + " / " + THEME_ORDER.length;
            drawThemePreview();
        }
        function stepTheme(dir) {
            const i = THEME_ORDER.indexOf(settings.theme);
            settings.theme = THEME_ORDER[(i + dir + THEME_ORDER.length) % THEME_ORDER.length];
            applyTheme();
            refreshAutoTrack();   // theme music follows immediately
            snd.click();          // and so does the click sound
            saveSettings();
        }
        function syncColorInputs() {
            for (const key in colInputs) colInputs[key].value = settings.classic[key];
        }
        function applyRotationSetting() {
            rotationToggle.innerText = settings.rotation ? t("on") : t("off");
            try {
                if (window.AndroidApp && AndroidApp.setRotationEnabled) {
                    AndroidApp.setRotationEnabled(!!settings.rotation);
                } else if (screen.orientation) {
                    if (!settings.rotation && screen.orientation.lock) {
                        screen.orientation.lock("portrait").catch(function () {});
                    } else if (settings.rotation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (e) { /* rotation control not available in this browser */ }
            fitCanvas();
        }
        function markActive(seg, attr, value) {
            seg.querySelectorAll("button").forEach((b) => {
                b.classList.toggle("active", b.getAttribute(attr) === value);
            });
        }

        settingsBtn.addEventListener("click", () => {
            if (!settingsPanel.hidden) { settingsPanel.hidden = true; snd.click(); return; }
            pauseIfPlaying();
            settingsPanel.hidden = false;
        });
        settingsClose.addEventListener("click", () => { settingsPanel.hidden = true; });
        nickInput.addEventListener("input", (e) => {
            settings.nick = cleanNick(e.target.value);
            updateScoreLabels();
            saveSettings();
        });
        nickInput.addEventListener("blur", () => {
            if (!settings.nick) {                     // never leave it empty
                settings.nick = "Player" + (100 + Math.floor(Math.random() * 900));
                nickInput.value = settings.nick;
                updateScoreLabels();
                saveSettings();
            }
            if (net.connected) netSend({ t: 4, nick: settings.nick });
        });
        langSeg.addEventListener("click", (e) => {
            const b = e.target.closest("button[data-lang]");
            if (!b) return;
            settings.lang = b.getAttribute("data-lang");
            markActive(langSeg, "data-lang", settings.lang);
            applyLanguage();
            saveSettings();
        });
        menuMain.addEventListener("click", (e) => {
            const b = e.target.closest("button[data-pick]");
            if (!b) return;
            snd.click();
            pickMode(b.getAttribute("data-pick"));
        });
        quickBtn.addEventListener("click", () => {
            snd.click();
            createBox.hidden = true;
            joinBox.hidden = true;
            netQuickPlay();
        });
        createBtn.addEventListener("click", () => {
            snd.click();
            netCleanup();
            joinBox.hidden = true;
            createBox.hidden = !createBox.hidden;
        });
        pubBtn.addEventListener("click", () => {
            snd.click();
            createBox.hidden = true;
            netHostPublic();
        });
        prvBtn.addEventListener("click", () => {
            snd.click();
            createBox.hidden = true;
            netHostPrivate();
        });
        joinBtn.addEventListener("click", () => {
            snd.click();
            netCleanup();
            createBox.hidden = true;
            joinBox.hidden = false;
            setNetStatus(t("netEnterCode"));
            codeInput.focus();
        });
        connectBtn.addEventListener("click", () => {
            snd.click();
            netJoin(codeInput.value);
        });
        codeInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") netJoin(codeInput.value);
        });
        onlineBackBtn.addEventListener("click", () => { snd.click(); showMainMenu(); });
        readyBackBtn.addEventListener("click", () => { snd.click(); showMainMenu(); });
        themePrev.addEventListener("click", () => stepTheme(-1));
        themeNext.addEventListener("click", () => stepTheme(1));
        // swipe across the preview to flick through themes
        (function () {
            let startX = null;
            themePreview.addEventListener("pointerdown", (e) => { startX = e.clientX; });
            themePreview.addEventListener("pointerup", (e) => {
                if (startX === null) return;
                const dx = e.clientX - startX;
                startX = null;
                if (Math.abs(dx) > 30) stepTheme(dx < 0 ? 1 : -1);
            });
        })();
        function hexToRgb(h) {
            return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
        }
        function colorDist(a, b) {
            const A = hexToRgb(a), B = hexToRgb(b);
            return Math.sqrt((A[0] - B[0]) ** 2 + (A[1] - B[1]) ** 2 + (A[2] - B[2]) ** 2);
        }
        const MIN_CONTRAST = 70;
        function classicConflict(key, value) {
            const c = Object.assign({}, settings.classic);
            c[key] = value;
            if (key === "bg") {
                return ["player", "ai", "ball"].some((k) => colorDist(c[k], c.bg) < MIN_CONTRAST);
            }
            return colorDist(c[key], c.bg) < MIN_CONTRAST;
        }
        let warnTimer = null;
        function showColorWarn() {
            colorWarn.hidden = false;
            clearTimeout(warnTimer);
            warnTimer = setTimeout(() => { colorWarn.hidden = true; }, 2500);
        }
        for (const key in colInputs) {
            colInputs[key].addEventListener("change", (e) => {
                const value = e.target.value;
                if (classicConflict(key, value)) {
                    e.target.value = settings.classic[key]; // revert
                    showColorWarn();
                    return;
                }
                settings.classic[key] = value;
                drawThemePreview();
                saveSettings();
            });
            // live preview while dragging inside the picker (no commit)
            colInputs[key].addEventListener("input", (e) => {
                if (!classicConflict(key, e.target.value)) {
                    settings.classic[key] = e.target.value;
                }
            });
        }
        colReset.addEventListener("click", () => {
            settings.classic = Object.assign({}, CLASSIC_DEFAULTS);
            syncColorInputs();
            saveSettings();
        });
        const THEME_NAME_KEY = { minecraft: "themeMinecraft", classic: "themeClassic",
            cyber: "themeCyber", nether: "themeNether", space: "themeSpace",
            ocean: "themeOcean", candy: "themeCandy", matrix: "themeMatrix" };
        function refreshOrderUI() {
            orderSelects.forEach((sel, slot) => {
                sel.innerHTML = "";
                [[-2, t("trackAuto")], [-1, t("trackNone")]].forEach(([v, label]) => {
                    const o = document.createElement("option");
                    o.value = v;
                    o.text = label;
                    sel.add(o);
                });
                // 24 tracks are a lot for one flat list, so group them by theme
                THEME_ORDER.forEach((theme) => {
                    const grp = document.createElement("optgroup");
                    grp.label = t(THEME_NAME_KEY[theme]);
                    (TRACKS_BY_THEME[theme] || []).forEach((i) => {
                        const o = document.createElement("option");
                        o.value = i;
                        o.text = TRACKS[i].name;
                        grp.appendChild(o);
                    });
                    sel.add(grp);
                });
                sel.value = settings.order[slot];
            });
        }
        orderSelects.forEach((sel, slot) => {
            sel.addEventListener("change", (e) => {
                settings.order[slot] = +e.target.value;
                refreshAutoAssignment();
                musicState.slot = 0;      // restart the playlist from slot 1
                musicState.step = 0;
                snd.click();
                saveSettings();
            });
        });
        musicVolSlider.addEventListener("input", (e) => {
            settings.musicVol = +e.target.value;
            applyVolumes();
            saveSettings();
        });
        sfxVolSlider.addEventListener("input", (e) => {
            settings.sfxVol = +e.target.value;
            applyVolumes();
            saveSettings();
        });
        rotationToggle.addEventListener("click", () => {
            settings.rotation = !settings.rotation;
            applyRotationSetting();
            saveSettings();
        });

        // ------- Buttons -------
        startBtn.addEventListener("click", () => {
            if (isOnline()) {
                if (!net.connected) { snd.click(); showOnlineMenu(); return; }
                if (net.role === "guest") { netSendCmd("start"); return; }
            }
            startGame();
        });
        pauseBtn.addEventListener("click", () => {
            if (isOnline() && net.role === "guest") { netSendCmd("pause"); snd.click(); return; }
            togglePause();
        });
        restartBtn.addEventListener("click", () => {
            if (isOnline() && net.role === "guest") return;  // guests can't restart
            restartMatch();
        });
        leaveBtn.addEventListener("click", () => {
            snd.click();
            netCleanup();          // closing the link drops the other side too
            duoScore = { p1: 0, p2: 0 };
            renderStats();
            showOnlineMenu();
        });
        difficultySelect.addEventListener("change", (e) => {
            activeDifficulty = e.target.value;
            resetBall();
        });

        // ------- Main loop -------
        // Every speed in this file is written in pixels per step, and the loop
        // used to run one step per drawn frame. That is correct only on a 60 Hz
        // display: on a 120 Hz phone or a 144 Hz monitor the whole game ran two
        // to three times too fast. The simulation now advances on a fixed 60 Hz
        // clock while drawing still happens once per frame, so a fast display
        // buys smoother motion instead of a faster game.
        const STEP_MS = 1000 / 60;
        const MAX_CATCHUP = 5;   // after a stall, drop the missed time rather
                                 // than teleport the ball through a paddle
        let stepAcc = 0, lastFrameAt = 0;

        function draw(now) {
            if (now === undefined) now = performance.now();   // the very first call
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ORIENT === "landscape") {
                // rotate the portrait field 90° clockwise: player appears on the left
                ctx.setTransform(0, 1, -1, 0, FIELD_H, 0);
            }
            if (isOnline() && net.role === "guest") {
                ctx.translate(0, FIELD_H);
                ctx.scale(1, -1);   // your paddle always sits at the bottom
            }
            if (shakeFrames > 0 && gameState === "PLAYING") {
                const mag = shakeFrames * 0.6;
                ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
            }
            drawFieldDecor();
            drawPaddle(player, true);
            drawPaddle(ai, false);
            drawBall();
            drawFx();
            drawVignette();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            if (gameState === "PAUSED") drawPauseOverlay();

            const elapsed = lastFrameAt ? now - lastFrameAt : STEP_MS;
            lastFrameAt = now;
            // clamped, so a hidden tab or a hiccup cannot queue up a hundred steps
            stepAcc = Math.min(stepAcc + Math.max(0, elapsed), STEP_MS * MAX_CATCHUP);
            while (stepAcc >= STEP_MS) {
                stepAcc -= STEP_MS;
                frame++;          // drives the animated themes
                stepDecor();
                updateFx();
                update();
            }
            requestAnimationFrame(draw);
        }

        // ------- Init -------
        difficultySelect.value = activeDifficulty;
        musicVolSlider.value = settings.musicVol;
        sfxVolSlider.value = settings.sfxVol;
        markActive(langSeg, "data-lang", settings.lang);
        refreshAutoAssignment();
        refreshOrderUI();
        applyTheme();
        applyMode();
        applyLanguage();
        applyRotationSetting();
        renderStats();
        showMainMenu();
        resetPaddles();
        resetBall();
        fitCanvas();
        draw();

        // ------- Web/iOS platform glue -------
        // Everything below is about the browser wrapper, not the game itself.

        // 1. Zoom guards. iOS Safari ignores maximum-scale in the viewport tag,
        //    so a double tap or a pinch would zoom the field mid-rally.
        document.addEventListener("gesturestart", (e) => e.preventDefault());
        document.addEventListener("gesturechange", (e) => e.preventDefault());
        //    Controls are left alone: touch-action:manipulation already covers
        //    them, and cancelling touchend there would swallow their click.
        let lastTapAt = 0;
        document.addEventListener("touchend", (e) => {
            const now = Date.now();
            const interactive = e.target.closest("button, select, input, label, a");
            if (!interactive && now - lastTapAt < 320) e.preventDefault();
            lastTapAt = now;
        }, { passive: false });

        // 2. Rubber-band scrolling. overscroll-behavior covers most browsers;
        //    older iOS still drags the whole page, so block any touch move that
        //    is not inside a scrollable overlay.
        document.addEventListener("touchmove", (e) => {
            if (e.touches.length > 1) { e.preventDefault(); return; }   // pinch
            if (!e.target.closest(".overlay")) e.preventDefault();
        }, { passive: false });

        // 3. Audio. Safari suspends the context whenever the app leaves the
        //    screen, and a home-screen launch can start it suspended, so resume
        //    on any touch as well as on the existing pointerdown hook.
        ["touchend", "click"].forEach((n) => document.addEventListener(n, () => {
            initAudio();
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }, { capture: true, passive: true }));
        window.addEventListener("pageshow", () => {
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        });

        // 4. Layout. iOS resizes the visual viewport when the toolbars slide in
        //    and out, and 100dvh alone lags a frame behind it.
        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", () => setTimeout(fitCanvas, 60));
        }
        window.addEventListener("pageshow", () => setTimeout(fitCanvas, 60));

        // 5. Offline. The service worker caches the game on first visit, so a
        //    home-screen launch works with no network at all. It needs https
        //    (or localhost); over plain http the game still runs, just online.
        //    build.ps1 strips this block from the standalone single-file build,
        //    which has no sw.js to point at and is already offline anyway.
    </script>
</body>
</html>
