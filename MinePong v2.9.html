    <title>Mine Pong Mobile</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { margin: 0; height: 100%; overscroll-behavior: none; }
        /* iOS ignores maximum-scale, so the zoom guards live in JS below;
           this only stops Safari from resizing text on rotation. */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            /* theme variables (minecraft default) */
            --page-bg: #000;
            --panel-bg: #1a1a1a;
            --panel-border: #555;
            --text: #ffffff;
            --text-dim: #c4c4c4;
            --accent: #ffff55;
            --accent-shadow: #3f3f00;
            --btn-bg: #5e5e5e;
            --btn-border: #000;
            --btn-hi: #aaa;
            --btn-lo: #333;
            --title-shadow: #373737;
            --field-border: #373737;
            --overlay-bg: rgba(0, 0, 0, 0.85);
            --glow: none;

            background-color: var(--page-bg);
            display: flex;
            flex-direction: column;
            font-family: "Courier New", Courier, monospace;
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        body[data-theme="classic"] {
            --page-bg: #000;
            --panel-bg: #000;
            --panel-border: #fff;
            --text: #fff;
            --text-dim: #bbb;
            --accent: #fff;
            --accent-shadow: transparent;
            --btn-bg: #000;
            --btn-border: #fff;
            --btn-hi: #666;
            --btn-lo: #666;
            --title-shadow: #444;
            --field-border: #fff;
            --overlay-bg: rgba(0, 0, 0, 0.88);
        }
        body[data-theme="nether"] {
            --page-bg: #140503;
            --panel-bg: #240a05;
            --panel-border: #ff7a1a;
            --text: #ffe8d6;
            --text-dim: #e0a077;
            --accent: #ff9d3c;
            --accent-shadow: #4a1600;
            --btn-bg: #3a0f06;
            --btn-border: #ff7a1a;
            --btn-hi: #6b2410;
            --btn-lo: #1a0603;
            --title-shadow: #c92a12;
            --field-border: #ff7a1a;
            --overlay-bg: rgba(20, 5, 3, 0.88);
            --glow: 0 0 8px rgba(255, 122, 26, 0.75);
        }
        body[data-theme="space"] {
            --page-bg: #04031a;
            --panel-bg: #0a0828;
            --panel-border: #9fd8ff;
            --text: #eef2ff;
            --text-dim: #a9b6e8;
            --accent: #c39cff;
            --accent-shadow: #1d0f3a;
            --btn-bg: #140f36;
            --btn-border: #9fd8ff;
            --btn-hi: #2b2159;
            --btn-lo: #070520;
            --title-shadow: #6f4bd8;
            --field-border: #9fd8ff;
            --overlay-bg: rgba(4, 3, 26, 0.9);
            --glow: 0 0 8px rgba(195, 156, 255, 0.7);
        }
        body[data-theme="ocean"] {
            --page-bg: #021c2e;
            --panel-bg: #04283f;
            --panel-border: #3fe0d0;
            --text: #e9ffff;
            --text-dim: #8fd0d8;
            --accent: #3fe0d0;
            --accent-shadow: #013038;
            --btn-bg: #06364f;
            --btn-border: #3fe0d0;
            --btn-hi: #0d5871;
            --btn-lo: #011824;
            --title-shadow: #1d7fd6;
            --field-border: #3fe0d0;
            --overlay-bg: rgba(2, 28, 46, 0.9);
            --glow: 0 0 8px rgba(63, 224, 208, 0.7);
        }
        body[data-theme="candy"] {
            --page-bg: #ffd9ea;
            --panel-bg: #ffeaf4;
            --panel-border: #ff5fa2;
            --text: #5a2740;
            --text-dim: #a35c7d;
            --accent: #ff2d7a;
            --accent-shadow: #ffd0e2;
            --btn-bg: #ffc2dc;
            --btn-border: #ff5fa2;
            --btn-hi: #fff0f7;
            --btn-lo: #e58bb0;
            --title-shadow: #7ed6ff;
            --field-border: #ff5fa2;
            --overlay-bg: rgba(255, 217, 234, 0.93);
            --glow: none;
        }
        body[data-theme="matrix"] {
            --page-bg: #000600;
            --panel-bg: #001400;
            --panel-border: #39ff14;
            --text: #b6ffb0;
            --text-dim: #4fbf46;
            --accent: #39ff14;
            --accent-shadow: #032b00;
            --btn-bg: #021c02;
            --btn-border: #39ff14;
            --btn-hi: #0a4a08;
            --btn-lo: #000d00;
            --title-shadow: #0aa30a;
            --field-border: #39ff14;
            --overlay-bg: rgba(0, 6, 0, 0.9);
            --glow: 0 0 8px rgba(57, 255, 20, 0.7);
        }
        body[data-theme="cyber"] {
            --page-bg: #05001a;
            --panel-bg: #0d0326;
            --panel-border: #00e5ff;
            --text: #eaf6ff;
            --text-dim: #7fd7e8;
            --accent: #00e5ff;
            --accent-shadow: #003a44;
            --btn-bg: #14063a;
            --btn-border: #ff2bd6;
            --btn-hi: #3a1a6a;
            --btn-lo: #08001c;
            --title-shadow: #ff2bd6;
            --field-border: #00e5ff;
            --overlay-bg: rgba(5, 0, 26, 0.88);
            --glow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        /* ---------- HUD ---------- */
        #duo-overlay {
            flex: 0 0 auto;
            background: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            align-items: center;
            padding: 6px 2px;
            padding-top: calc(6px + env(safe-area-inset-top));
        }
        #duo-overlay .stat-val { font-size: clamp(18px, 6vw, 26px); }
        #ui-overlay {
            flex: 0 0 auto;
            background: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: center;
            padding: 6px 2px 6px;
            padding-top: calc(6px + env(safe-area-inset-top));
        }
        .stat-box { text-align: center; line-height: 1.15; }
        .stat-label {
            display: block;
            font-size: clamp(7px, 2.2vw, 9px);
            letter-spacing: 0.5px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-val { color: var(--accent); font-size: clamp(13px, 4vw, 17px); font-weight: bold; text-shadow: var(--glow); }
        .stat-box { min-width: 0; }

        /* ---------- Game area ---------- */
        #game-area {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            padding: 6px;
        }
        #game-container {
            position: relative;
            border: 6px solid var(--field-border);
            box-shadow: 0 0 0 2px #111;
        }
        body[data-theme="cyber"] #game-container { box-shadow: 0 0 18px rgba(0, 229, 255, 0.45); }
        body[data-theme="nether"] #game-container { box-shadow: 0 0 18px rgba(255, 122, 26, 0.45); }
        body[data-theme="space"] #game-container { box-shadow: 0 0 18px rgba(159, 216, 255, 0.35); }
        body[data-theme="ocean"] #game-container { box-shadow: 0 0 18px rgba(63, 224, 208, 0.4); }
        body[data-theme="matrix"] #game-container { box-shadow: 0 0 18px rgba(57, 255, 20, 0.35); }
        /* Desktop / tablet: the field already scales itself, but the HUD and the
           button bar would otherwise stretch across the whole monitor. */
        @media (min-width: 760px) {
            #ui-overlay, #duo-overlay, #controls-panel {
                max-width: 900px;
                width: 100%;
                margin-inline: auto;
            }
            .stat-label { font-size: 10px; }
            .stat-val { font-size: 20px; }
            #controls-panel button, #controls-panel select { font-size: 14px; padding: 8px 14px; }
        }
        canvas {
            background-color: #000;
            image-rendering: pixelated;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* ---------- Overlays ---------- */
        .overlay {
            position: absolute;
            inset: 0;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            /* flex-start + auto margins = centered when short,
               fully scrollable when taller than the screen
               (justify-content: center would cut off the top) */
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        /* zero-height spacers with auto margins: they centre the content when it
           fits and collapse when it doesn't, so nothing gets cut off.
           (:first-child/:last-child would break whenever a panel is hidden) */
        .overlay::before, .overlay::after { content: ""; flex: 0 0 0; margin: auto; }
        #screen { z-index: 10; }
        #settings-panel { z-index: 20; }
        h1 {
            font-size: clamp(28px, 9vw, 52px);
            margin: 0;
            color: var(--text);
            text-shadow: 4px 4px var(--title-shadow);
        }
        #splash {
            color: var(--accent);
            font-size: clamp(13px, 4vw, 18px);
            margin: 10px 0 14px;
            font-weight: bold;
            text-shadow: 2px 2px var(--accent-shadow);
            transform: rotate(-5deg);
        }
        #status-text { margin-bottom: 16px; font-size: 14px; color: var(--text-dim); }
        #hint { margin-top: 18px; font-size: 12px; color: var(--text-dim); opacity: 0.8; }

        /* ---------- Buttons ---------- */
        button, select {
            padding: 10px 16px;
            font-size: 16px;
            font-family: "Courier New", Courier, monospace;
            background: var(--btn-bg);
            color: var(--text);
            border: 3px solid var(--btn-border);
            cursor: pointer;
            box-shadow: inset -4px -4px var(--btn-lo), inset 4px 4px var(--btn-hi);
            touch-action: manipulation;
        }
        button:active { box-shadow: inset -2px -2px var(--btn-lo), inset 2px 2px var(--btn-hi); transform: translateY(1px); }
        #start-btn { font-size: 20px; padding: 12px 28px; }

        /* ---------- Bottom control bar ---------- */
        #controls-panel {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 6px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            background: var(--panel-bg);
            border-top: 2px solid var(--panel-border);
        }
        #controls-panel button, #controls-panel select {
            font-size: clamp(11px, 3.2vw, 14px);
            padding: 8px clamp(6px, 2vw, 12px);
            flex: 0 1 auto;
            min-width: 0;
            white-space: nowrap;
        }
        #settings-btn { font-size: clamp(15px, 4vw, 18px); padding: 6px clamp(8px, 2.4vw, 12px); }

        /* ---------- Settings panel ---------- */
        #settings-panel h2 { margin: 0 0 12px; font-size: 22px; text-shadow: 2px 2px var(--title-shadow); }
        .set-row { margin-bottom: 12px; width: 100%; max-width: 340px; flex-shrink: 0; }
        .set-row-label {
            display: block;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .seg { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .seg button { flex: 1 1 auto; font-size: 13px; padding: 8px 8px; min-width: 88px; }
        .seg button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--btn-border);
            text-shadow: none;
        }
        #settings-close { margin-top: 10px; }
        .theme-picker {
            display: flex;
            align-items: stretch;
            gap: 8px;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        .theme-picker > button {
            flex: 0 0 auto;
            font-size: 18px;
            padding: 8px 12px;
        }
        .theme-view {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 3px solid var(--btn-border);
            background: var(--btn-bg);
            padding: 6px 4px;
        }
        #theme-preview {
            width: 100%;
            height: 46px;
            display: block;
            image-rendering: pixelated;
        }
        #theme-name {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: var(--glow);
        }
        #theme-pos { font-size: 10px; color: var(--text-dim); }
        .color-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 12px;
            align-items: center;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        .color-row label { font-size: 13px; text-align: left; color: var(--text); }
        input[type="color"] {
            width: 48px;
            height: 32px;
            padding: 2px;
            border: 3px solid var(--btn-border);
            background: var(--btn-bg);
            cursor: pointer;
        }
        .mini-btn { margin-top: 10px; font-size: 12px; padding: 6px 10px; }
        .menu-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .menu-btn {
            width: 100%;
            font-size: clamp(14px, 4.4vw, 18px);
            padding: 12px 10px;
        }
        .back-btn { margin-top: 6px; font-size: 13px; padding: 8px; opacity: 0.85; }
        .menu-label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        #create-box { width: 100%; margin-top: 2px; }
        #create-box .seg { width: 100%; }
        #create-box .seg button { flex: 1 1 0; }
        #room-code {
            margin-top: 10px;
            font-size: clamp(24px, 8vw, 34px);
            font-weight: bold;
            letter-spacing: 6px;
            color: var(--accent);
            text-shadow: 2px 2px var(--accent-shadow), var(--glow);
        }
        #join-box { margin-top: 4px; display: flex; gap: 6px; justify-content: center; width: 100%; }
        #code-input {
            flex: 1 1 auto;
            min-width: 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
            padding: 8px;
            background: var(--btn-bg);
            color: var(--text);
            border: 3px solid var(--btn-border);
        }
        #net-status {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-dim);
            min-height: 16px;
        }
        #net-status.ok { color: #55ff77; font-weight: bold; }
        #net-status.err { color: #ff5555; font-weight: bold; }
        .color-warn {
            margin-top: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #ff5555;
            text-shadow: 1px 1px #3a0000;
        }
        .order-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 10px;
            align-items: center;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        .order-num {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: var(--glow);
        }
        .order-sel { width: 100%; font-size: 13px; padding: 8px 8px; }
        .version-line {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        #nick-input {
            width: 100%;
            max-width: 340px;
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            text-align: center;
            padding: 8px;
            background: var(--btn-bg);
            color: var(--text);
            border: 3px solid var(--btn-border);
        }
        .credits-line {
            font-size: 13px;
            color: var(--accent);
            text-shadow: 1px 1px var(--accent-shadow);
            margin-top: 4px;
        }
        input[type="range"] {
            width: 100%;
            max-width: 340px;
            accent-color: var(--accent);
            height: 28px;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body data-theme="minecraft">
    <div id="ui-overlay">
        <div class="stat-box"><span class="stat-label" data-i18n="wins">WINS</span><span id="wins" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label" data-i18n="losses">LOSSES</span><span id="losses" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label" data-i18n="hits">HITS</span><span id="hits" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label" data-i18n="bestWins">BEST WINS</span><span id="best-wins" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label" data-i18n="bestHits">BEST HITS</span><span id="best-hits" class="stat-val">0</span></div>
    </div>

    <div id="duo-overlay" hidden>
        <div class="stat-box"><span class="stat-label" id="lbl-p2" data-i18n="p2">PLAYER 2</span><span id="score-p2" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label" id="lbl-p1" data-i18n="p1">PLAYER 1</span><span id="score-p1" class="stat-val">0</span></div>
    </div>

    <div id="game-area">
        <div id="game-container">
            <div id="screen" class="overlay">
                <h1>MINE PONG</h1>
                <div id="splash"></div>

                <div id="menu-main" class="menu-panel">
                    <button type="button" class="menu-btn" data-pick="solo" data-i18n="modeSolo">1 PLAYER</button>
                    <button type="button" class="menu-btn" data-pick="duo" data-i18n="modeDuo">2 PLAYERS</button>
                    <button type="button" class="menu-btn" data-pick="online" data-i18n="modeOnline">2 PLAYERS ONLINE</button>
                </div>

                <div id="menu-online" class="menu-panel" hidden>
                    <button type="button" class="menu-btn" id="quick-btn" data-i18n="quickPlay">QUICK GAME</button>
                    <button type="button" class="menu-btn" id="create-btn" data-i18n="createRoom">CREATE ROOM</button>
                    <button type="button" class="menu-btn" id="join-btn" data-i18n="joinRoom">JOIN BY CODE</button>
                    <div id="create-box" hidden>
                        <span class="menu-label" data-i18n="roomType">Room type:</span>
                        <div class="seg">
                            <button type="button" id="pub-btn" data-i18n="roomPublic">PUBLIC</button>
                            <button type="button" id="prv-btn" data-i18n="roomPrivate">PRIVATE</button>
                        </div>
                    </div>
                    <div id="join-box" hidden>
                        <input type="text" id="code-input" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false">
                        <button type="button" id="connect-btn" data-i18n="connect">GO</button>
                    </div>
                    <div id="room-code" hidden></div>
                    <div id="net-status"></div>
                    <button type="button" class="menu-btn back-btn" id="online-back" data-i18n="back">BACK</button>
                </div>

                <div id="menu-ready" class="menu-panel" hidden>
                    <div id="status-text"></div>
                    <button id="start-btn" type="button" data-i18n="start">START</button>
                    <div id="hint"></div>
                    <button type="button" class="menu-btn back-btn" id="ready-back" data-i18n="back">BACK</button>
                </div>
            </div>
            <div id="settings-panel" class="overlay" hidden>
                <h2 data-i18n="settings">SETTINGS</h2>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="language">Language</span>
                    <div class="seg" id="lang-seg">
                        <button type="button" data-lang="en">English</button>
                        <button type="button" data-lang="ru">Русский</button>
                        <button type="button" data-lang="uk">Українська</button>
                    </div>
                </div>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="theme">Theme</span>
                    <div class="theme-picker">
                        <button type="button" id="theme-prev" aria-label="Previous theme">&#9664;</button>
                        <div class="theme-view">
                            <canvas id="theme-preview" width="220" height="60"></canvas>
                            <span id="theme-name"></span>
                            <span id="theme-pos"></span>
                        </div>
                        <button type="button" id="theme-next" aria-label="Next theme">&#9654;</button>
                    </div>
                </div>
                <div class="set-row" id="classic-colors" hidden>
                    <span class="set-row-label" data-i18n="classicColors">Classic colors</span>
                    <div class="color-row">
                        <label for="col-player" data-i18n="colPlayer">Your paddle</label><input type="color" id="col-player" value="#ffffff">
                        <label for="col-ai" data-i18n="colAi">AI paddle</label><input type="color" id="col-ai" value="#ffffff">
                        <label for="col-ball" data-i18n="colBall">Ball</label><input type="color" id="col-ball" value="#ffffff">
                        <label for="col-bg" data-i18n="colBg">Background</label><input type="color" id="col-bg" value="#000000">
                    </div>
                    <div id="color-warn" class="color-warn" hidden data-i18n="colWarn">Too similar to the background!</div>
                    <button type="button" id="col-reset" class="mini-btn" data-i18n="colReset">RESET COLORS</button>
                </div>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="musicVol">Music volume</span>
                    <input type="range" id="music-vol" min="0" max="100" step="1">
                </div>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="sfxVol">Sound volume</span>
                    <input type="range" id="sfx-vol" min="0" max="100" step="1">
                </div>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="musicOrder">Melody order</span>
                    <div class="order-grid">
                        <label class="order-num">1</label><select id="order-0" class="order-sel"></select>
                        <label class="order-num">2</label><select id="order-1" class="order-sel"></select>
                        <label class="order-num">3</label><select id="order-2" class="order-sel"></select>
                    </div>
                </div>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="rotation">Screen rotation</span>
                    <div class="seg">
                        <button type="button" id="rotation-toggle"></button>
                    </div>
                </div>
                <div class="set-row">
                    <span class="set-row-label" data-i18n="nickname">Nickname</span>
                    <input type="text" id="nick-input" maxlength="12" autocomplete="off" spellcheck="false">
                </div>
                <div class="set-row" id="credits">
                    <span class="set-row-label" data-i18n="creditsTitle">Credits</span>
                    <div class="credits-line" data-i18n="creditsLine1">Miha - idea maker</div>
                    <div class="credits-line" data-i18n="creditsLine2">Andrey Kovalenko - code creator</div>
                    <div class="version-line" id="version-line"></div>
                </div>
                <button id="settings-close" type="button" data-i18n="close">CLOSE</button>
            </div>
            <canvas id="pong" width="512" height="800"></canvas>
        </div>
    </div>

    <div id="controls-panel">
        <button id="pause-btn" type="button" data-i18n="pause">PAUSE</button>
        <button id="restart-btn" type="button" data-i18n="restart">RESTART</button>
        <button id="leave-btn" type="button" hidden></button>
        <select id="difficulty" aria-label="Difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
        </select>
        <button id="settings-btn" type="button" aria-label="Settings">⚙</button>
    </div>

        function detectLang() {
            const l = (navigator.language || "en").toLowerCase();
            if (l.startsWith("ru")) return "ru";
            if (l.startsWith("uk")) return "uk";
            return "en";

        // ------- Settings -------
        // These two hooks stay in-memory here; in the Android app they are
        // patched to use localStorage so settings survive restarts.
        // Settings live in localStorage, so they survive a reload, a relaunch
        // from the home screen and a restart of the Android app - this same file
        // ships as assets/index.html inside the APK. Private mode can make the
        // call throw, and then the game just runs with defaults for the session.
        const STORE_KEY = "minepong.settings";
        const LEGACY_STORE_KEY = "minePongSettingsV1";   // written by MinePong 2.9 for Android
        function loadSavedSettings() {
            try {
                const raw = localStorage.getItem(STORE_KEY) ||
                            localStorage.getItem(LEGACY_STORE_KEY);
                if (!raw) return null;
                const p = JSON.parse(raw);
                // Anything here may have been hand-edited or written by another
                // version, and a bad value would break the game on startup: an
                // unknown language makes every t() call throw.
                if (!I18N[p.lang]) p.lang = "en";
                // Spelled out rather than read from THEME_ORDER: that constant is
                // declared far below this line, so touching it here would throw.
                // Keep the two lists in step when adding a theme.
                const themes = ["minecraft", "classic", "cyber", "nether", "space", "ocean", "candy", "matrix"];
                if (!themes.includes(p.theme)) p.theme = "minecraft";
                p.rotation = !!p.rotation;
                if (!p.classic || typeof p.classic !== "object") p.classic = {};
                const clampVol = (v) => (Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : undefined);
                p.musicVol = clampVol(p.musicVol);
                p.sfxVol = clampVol(p.sfxVol);
                if (p.mode === "online") p.mode = "solo";   // never boot into a dead room
                return p;
            } catch (e) { return null; }
        }
        function saveSettings() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); }
            catch (e) { /* storage full or blocked: keep playing anyway */ }
        } /* SETTINGS_SAVE_HOOK */

        const CLASSIC_DEFAULTS = { player: "#ffffff", ai: "#ffffff", ball: "#ffffff", bg: "#000000" };
        const GAME_VERSION = "2.9";
        function cleanNick(v) {
            return String(v || "").replace(/[\u0000-\u001f]/g, "").trim().slice(0, 12);
        }
        let settings = loadSavedSettings() || { lang: detectLang(), theme: "minecraft", rotation: false };
        settings.nick = cleanNick(settings.nick) || ("Player" + (100 + Math.floor(Math.random() * 900)));
        settings.classic = Object.assign({}, CLASSIC_DEFAULTS, settings.classic || {});
        if (!["solo", "duo"].includes(settings.mode)) settings.mode = "solo";
        if (typeof settings.musicVol !== "number") settings.musicVol = 50;
        if (typeof settings.sfxVol !== "number") settings.sfxVol = 80;
        if (!Array.isArray(settings.order) || settings.order.length !== 3 ||
            !settings.order.every((v) => v === -2 || v === -1 || (v >= 0 && v < 24))) {
            settings.order = [-2, -2, -2];   // three theme tracks by default
        }

        // ------- Online play: direct peer-to-peer link between two phones -------
        // One player creates a room and gets a short code, the other types it in.
        // The host runs the physics and streams the state; the guest sends its
        // paddle position back. No game server involved.
        const net = {
            peer: null, conn: null, role: null, code: "",
            connected: false, remoteX: null, fieldH: null, isPublic: false, rivalNick: "",
            seq: 0, pendingEv: 0, retries: 0
        };
        function isOnline() { return settings.mode === "online"; }
        function isTwoPlayer() { return settings.mode === "duo" || settings.mode === "online"; }
        function netAvailable() { return typeof window.Peer === "function"; }
        function setNetStatus(text, cls) {
            netStatusEl.innerText = text || "";
            netStatusEl.className = cls || "";
        }
        function randomCode() {
            const abc = "ACDEFGHJKLMNPQRTUVWXY34679"; // no lookalike characters
            let out = "";
            for (let i = 0; i < 5; i++) out += abc[Math.floor(Math.random() * abc.length)];
            return out;
        }
        // Public rooms live in a small pool of well-known ids. Claiming an id
        // registers the room; a failed connect means that slot is empty.
        // This gives matchmaking without running any lobby server.
        const PUB_SLOTS = 24;
        const pubId = (n) => "minepong-pub-" + String(n).padStart(2, "0");
        const prvId = (code) => "minepong-prv-" + code;
        function shuffled(n) {
            const a = Array.from({ length: n }, (_, i) => i + 1);
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        function netCleanup(quiet) {
            try { if (net.conn) net.conn.close(); } catch (e) {}
            try { if (net.peer) net.peer.destroy(); } catch (e) {}
            net.peer = net.conn = net.role = null;
            net.connected = false;
            net.remoteX = null;
            net.fieldH = null;
            net.code = "";
            net.isPublic = false;
            net.rivalNick = "";
            net.retries = 0;
            roomCodeEl.hidden = true;
            joinBox.hidden = true;
            updateRoomButtons();
            if (!quiet) setNetStatus("");
            fitCanvas();
        }
        // ---- hosting ----
        function netHostPrivate() {
            if (!netAvailable()) { setNetStatus(t("netNoLib"), "err"); return; }
            netCleanup(true);
            net.role = "host";
            net.isPublic = false;
            net.code = randomCode();
            setNetStatus(t("netConnecting"));
            openHostPeer(prvId(net.code), () => {
                if (net.retries++ < 4) netHostPrivate();      // that code is taken
                else setNetStatus(t("netError"), "err");
            });
        }
        function netHostPublic(slotQueue) {
            if (!netAvailable()) { setNetStatus(t("netNoLib"), "err"); return; }
            const queue = slotQueue || shuffled(PUB_SLOTS);
            if (!queue.length) { setNetStatus(t("netFull"), "err"); return; }
            const slot = queue.shift();
            netCleanup(true);
            net.role = "host";
            net.isPublic = true;
            net.code = "P" + String(slot).padStart(2, "0");
            setNetStatus(t("netConnecting"));
            openHostPeer(pubId(slot), () => netHostPublic(queue)); // slot busy, next one
        }
        function openHostPeer(id, onTaken) {
            net.peer = new Peer(id, { debug: 0 });
            net.peer.on("open", () => {
                roomCodeEl.hidden = false;
                roomCodeEl.innerText = net.code;
                setNetStatus(t("netCodeHint") + " " + net.code + ". " +
                    (net.isPublic ? t("netRoomPublic") : t("netRoomPrivate")) + " " + t("netWaiting"));
            });
            net.peer.on("connection", (c) => {
                if (net.conn && net.connected) { try { c.close(); } catch (e) {} return; }
                attachConn(c);
            });
            net.peer.on("error", (err) => {
                if (err && err.type === "unavailable-id") { onTaken(); return; }
                setNetStatus(t("netError"), "err");
            });
        }
        // ---- joining ----
        function codeToId(code) {
            const c = code.trim().toUpperCase();
            const m = c.match(/^P(\d{1,2})$/);
            return m ? pubId(+m[1]) : prvId(c);
        }
        function netJoin(code) {
            if (!netAvailable()) { setNetStatus(t("netNoLib"), "err"); return; }
            if (!code) return;
            netCleanup(true);
            net.role = "guest";
            setNetStatus(t("netConnecting"));
            net.peer = new Peer({ debug: 0 });
            net.peer.on("open", () => {
                attachConn(net.peer.connect(codeToId(code), { serialization: "json" }));
            });
            net.peer.on("error", () => setNetStatus(t("netError"), "err"));
        }
        // ---- quick game: probe public slots, host one if all are empty ----
        function netQuickPlay() {
            if (!netAvailable()) { setNetStatus(t("netNoLib"), "err"); return; }
            netCleanup(true);
            net.role = "guest";
            setNetStatus(t("netSearching"));
            const queue = shuffled(PUB_SLOTS);
            net.peer = new Peer({ debug: 0 });
            let probe = null, timer = null, attempt = 0, done = false;
            // a failed slot can report twice (connection error + peer error),
            // so each attempt carries a token and only advances the scan once
            function fail(token) {
                if (done || token !== attempt) return;
                clearTimeout(timer);
                if (probe) { try { probe.close(); } catch (e) {} probe = null; }
                tryNext();
            }
            function tryNext() {
                if (done) return;
                if (!queue.length) {              // nobody waiting: open our own room
                    done = true;
                    setNetStatus(t("netNoRooms"));
                    setTimeout(() => netHostPublic(), 50);
                    return;
                }
                const token = ++attempt;
                probe = net.peer.connect(pubId(queue.shift()), { serialization: "json" });
                probe.on("open", () => {
                    if (done || token !== attempt) return;
                    done = true;
                    clearTimeout(timer);
                    attachConn(probe, true);
                });
                probe.on("error", () => fail(token));
                timer = setTimeout(() => fail(token), 2200);   // empty slot, move on
            }
            net.peer.on("open", tryNext);
            net.peer.on("error", (err) => {
                if (done) return;
                if (err && err.type === "peer-unavailable") fail(attempt);
                else setNetStatus(t("netError"), "err");
            });
        }
        function attachConn(c, alreadyOpen) {
            net.conn = c;
            const onOpen = () => {
                net.connected = true;
                net.remoteX = null;
                net.rivalNick = "";
                netSend({ t: 4, nick: settings.nick });   // say hello with our name
                duoScore = { p1: 0, p2: 0 };
                roomCodeEl.hidden = net.role !== "host";
                joinBox.hidden = true;
                setNetStatus(t("netConnected"), "ok");
                renderStats();
                updateScoreLabels();
                updateRoomButtons();
                showMenu(net.role === "host" ? "statusOnlineReady" : "statusGuestWait");
                hintEl.innerText = currentHint();
                snd.point();
            };
            // the "open" event may already have fired (quick game probes),
            // in which case listening for it would never trigger
            if (alreadyOpen || c.open) onOpen(); else c.on("open", onOpen);
            c.on("data", handleNetMessage);
            c.on("close", () => {
                net.connected = false;
                net.conn = null;
                net.remoteX = null;
                setNetStatus(t("netLost"), "err");
                updateRoomButtons();
                if (isOnline()) showOnlineMenu();
            });
            c.on("error", () => setNetStatus(t("netError"), "err"));
        }
        function netSend(obj) {
            if (!net.connected || !net.conn) return;
            try { net.conn.send(obj); } catch (e) {}
        }
        function netSendState() {
            if (net.role !== "host") return;
            const ev = net.pendingEv;
            net.pendingEv = 0;
            net.seq++;
            if (!ev && net.seq % 2) return;   // ~30 updates per second
            netSend({
                t: 1, h: FIELD_H,
                bx: Math.round(ball.x), by: Math.round(ball.y),
                px: Math.round(player.x), ax: Math.round(ai.x),
                s1: duoScore.p1, s2: duoScore.p2,
                st: gameState, ev: ev
            });
        }
        function netSendPaddle() {
            if (net.role !== "guest") return;
            net.seq++;
            if (net.seq % 2) return;
            netSend({ t: 2, x: Math.round(ai.x) });
        }
        function netSendCmd(action) { netSend({ t: 3, a: action }); }
        function playNetEvent(ev) {
            const bx = ball.x + ball.size / 2;
            const by = ball.y + ball.size / 2;
            if (ev === 1) { snd.playerHit(); spawnImpact(bx, by, 0, -1, "player"); }
            else if (ev === 2) { snd.aiHit(); spawnImpact(bx, by, 0, 1, "ai"); }
            else if (ev === 3) { snd.wall(); spawnImpact(bx, by, 0, 0, "wall"); }
            else if (ev === 4 || ev === 5) { snd.point(); }
        }
        function handleNetMessage(msg) {
            if (!msg || typeof msg !== "object") return;
            if (msg.t === 1 && net.role === "guest") {
                if (msg.h && msg.h !== net.fieldH) { net.fieldH = msg.h; fitCanvas(); }
                ball.x = msg.bx; ball.y = msg.by;
                player.x = msg.px;              // the host's paddle
                duoScore.p1 = msg.s1; duoScore.p2 = msg.s2;
                renderStats();
                if (msg.ev) playNetEvent(msg.ev);
                if (msg.st && msg.st !== gameState) {
                    if (msg.st === "PLAYING") {
                        hideMenu();
                        gameState = "PLAYING";
                        pauseBtn.innerText = t("pause");
                        settingsPanel.hidden = true;
                    } else if (msg.st === "PAUSED") {
                        gameState = "PAUSED";
                        pauseBtn.innerText = t("resume");
                    } else {
                        showMenu("statusGuestWait");
                    }
                }
            } else if (msg.t === 4) {
                net.rivalNick = cleanNick(msg.nick);
                updateScoreLabels();
                setNetStatus(t("playingWith") + " " + (net.rivalNick || "?"), "ok");
            } else if (msg.t === 2 && net.role === "host") {
                net.remoteX = msg.x;
            } else if (msg.t === 3 && net.role === "host") {
                if (msg.a === "start") startGame();
                else if (msg.a === "pause") togglePause();
                else if (msg.a === "restart") restartMatch();
            }
        }

        // ------- Audio: fully synthesized with Web Audio, no files needed -------
        let audioCtx = null, sfxGain = null, musicGain = null, musicTimer = null;
        function midi(m) { return 440 * Math.pow(2, (m - 69) / 12); }
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { return; }
            sfxGain = audioCtx.createGain();
            musicGain = audioCtx.createGain();
            sfxGain.connect(audioCtx.destination);
            // music goes both dry and through a soft echo, SNES-style
            musicGain.connect(audioCtx.destination);
            const delay = audioCtx.createDelay(1.0);
            delay.delayTime.value = 0.27;
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.28;
            const wet = audioCtx.createGain();
            wet.gain.value = 0.16;
            musicGain.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(wet);
            wet.connect(audioCtx.destination);
            applyVolumes();
            startMusic();
        }
        function applyVolumes() {
            if (sfxGain) sfxGain.gain.value = settings.sfxVol / 100;
            if (musicGain) musicGain.gain.value = (settings.musicVol / 100) * 0.55;
        }
        function tone(freq, dur, type, vol, slideTo) {
            if (!audioCtx || audioCtx.state !== "running") return;
            const t = audioCtx.currentTime;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.connect(g); g.connect(sfxGain);
            o.start(t); o.stop(t + dur + 0.03);
        }
        function seq(freqs, step, type, vol) {
            freqs.forEach((f, i) => setTimeout(() => tone(f, step * 0.92, type, vol), i * step * 1000));
        }
        // ------- Sound effects: every theme has its own voice -------
        // A profile picks the waveform and the notes, so Minecraft blips,
        // Nether growls, Ocean bubbles and Matrix beeps all sound different.
        const SFX = {

            ocean:     { wave: "sine",     hit: [520, 260], rival: [400, 200], wall: ["sine", 300, 150],

        function sfxProfile() { return SFX[settings.theme] || SFX.minecraft; }
        function noiseBurst(vol, dur, hp) {
            if (!audioCtx || audioCtx.state !== "running") return;
            const t = audioCtx.currentTime;
            const src = audioCtx.createBufferSource();

            f.type = "highpass";
